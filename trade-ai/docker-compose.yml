services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trade_ai
      POSTGRES_PASSWORD: trade_ai
      POSTGRES_DB: trade_ai
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trade_ai:trade_ai@db:5432/trade_ai
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
