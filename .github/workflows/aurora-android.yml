name: Aurora Android

on:
  push:
    paths:
      - "aurora/**"
      - ".github/workflows/aurora-android.yml"
  pull_request:
    paths:
      - "aurora/**"
      - ".github/workflows/aurora-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aurora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do domínio (core)
        run: ./gradlew -p core test --stacktrace

      - name: Testes unitários do app
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-debug-apk
          path: aurora/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-reports
          path: |
            aurora/core/build/reports/
            aurora/app/build/reports/
          if-no-files-found: ignore
