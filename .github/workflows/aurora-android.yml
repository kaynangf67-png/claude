name: Aurora Android

on:
  push:
    paths:
      - "aurora/**"
      - ".github/workflows/aurora-android.yml"
  pull_request:
    paths:
      - "aurora/**"
      - ".github/workflows/aurora-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aurora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o AGP baixa a plataforma que faltar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do domínio (core)
        run: ./gradlew -p core test --stacktrace

      - name: Testes unitários do app
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Esquema do banco versionado confere com o gerado
        # O build regera app/schemas; qualquer diferença significa esquema alterado sem ser versionado.
        run: |
          novos=$(git ls-files --others --exclude-standard app/schemas)
          # Versão compacta (uma linha) + SHA-256 para copiar e conferir o arquivo gerado.
          for f in $novos $(git diff --name-only app/schemas); do
            echo "=== GERADO $f"
            python3 -c "import json,sys,hashlib;c=json.dumps(json.load(open(sys.argv[1])),separators=(',',':'),ensure_ascii=False);print('SHA256',hashlib.sha256(c.encode()).hexdigest());print(c)" "$f"
          done
          if ! git diff --ignore-all-space --exit-code app/schemas || [ -n "$novos" ]; then
            echo "::error::Esquema do Room diferente do versionado. Atualize app/schemas."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aurora-debug-apk
          path: aurora/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-reports
          path: |
            aurora/core/build/reports/
            aurora/app/build/reports/
          if-no-files-found: ignore

  instrumented:
    # Testes no emulador: banco (DAOs, migrações) e integrações Android.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes instrumentados (emulador API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: aurora
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Resumo das falhas instrumentadas
        if: failure()
        working-directory: aurora
        run: |
          python3 - <<'PY'
          import glob, re, html
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              s = open(f, encoding='utf-8').read()
              for name, cls, msg in re.findall(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]*)"', s):
                  print(f"FALHOU {cls.split('.')[-1]}.{name}: {html.unescape(msg)[:1500]}")
          PY

      - name: Publicar relatórios instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-instrumented-reports
          path: aurora/app/build/reports/androidTests/
          if-no-files-found: ignore
