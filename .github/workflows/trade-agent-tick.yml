# Agendador gratuito do TRADE AGENT: chama /api/agent?action=tick a cada 5 minutos, de segunda a sexta.
# Horário em UTC: 07:00–20:59 UTC = 04:00–17:59 em Brasília (a janela operacional do agente é configurável no painel).
# ATENÇÃO: o GitHub só executa workflows agendados a partir do branch PADRÃO do repositório, e pode atrasar execuções
# em horários de pico (a granularidade real não é garantida). Para intervalos curtos e garantidos, use o worker (docs/TRADE-AGENT.md).
name: trade-agent-tick
on:
  schedule:
    - cron: "*/5 7-20 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: trade-agent-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Executar uma varredura do agente
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$AGENT_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets AGENT_URL e CRON_SECRET não configuradas."; exit 1; fi
          code=$(curl -sS -o resp.json -w "%{http_code}" --max-time 100 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-vercel-protection-bypass: $VERCEL_BYPASS" \
            "$AGENT_URL/api/agent?action=tick")
          # o repositório é público: o log mostra só o código HTTP e a ação, nunca o conteúdo da resposta
          action=$(grep -o '"action":"[a-z]*"' resp.json | head -1 || true)
          echo "HTTP $code ${action}"
          [ "$code" = "200" ] || exit 1
      - name: Executar um ciclo da mesa Zyon (simulada)
        if: always()
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$AGENT_URL" ]; then echo "Secret AGENT_URL não configurada."; exit 1; fi
          code=$(curl -sS -o zy.json -w "%{http_code}" --max-time 100 -X POST \
            -H "x-vercel-protection-bypass: $VERCEL_BYPASS" \
            "$AGENT_URL/api/agent?action=zyon-cycle")
          ran=$(grep -o '"ran":[a-z]*' zy.json | head -1 || true)
          echo "HTTP $code ${ran}"
          [ "$code" = "200" ] || exit 1
